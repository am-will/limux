name: Build Linux Release Packages

on:
  pull_request:
    paths:
      - .github/workflows/release-linux.yml
      - Cargo.lock
      - Cargo.toml
      - ghostty
      - rust/**
      - scripts/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v prefix)"
        required: true

permissions:
  contents: write

jobs:
  packages:
    name: Build tarball, deb, and AppImage on Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release version
        run: ./scripts/validate-release-version.sh "${{ steps.version.outputs.version }}"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            binutils \
            build-essential \
            desktop-file-utils \
            gettext \
            libadwaita-1-dev \
            libepoxy-dev \
            libgdk-pixbuf2.0-bin \
            libgtk-4-dev \
            librsvg2-common \
            libxml2-utils \
            libwebkitgtk-6.0-dev \
            meson \
            ninja-build \
            python3-gi \
            pkg-config

      - name: Install current blueprint-compiler
        run: |
          BLUEPRINT_VERSION=v0.20.4
          git clone --depth 1 --branch "${BLUEPRINT_VERSION}" https://github.com/GNOME/blueprint-compiler.git /tmp/blueprint-compiler
          meson setup /tmp/blueprint-compiler/_build /tmp/blueprint-compiler --prefix /tmp/blueprint-prefix
          meson install -C /tmp/blueprint-compiler/_build
          echo "/tmp/blueprint-prefix/bin" >> "$GITHUB_PATH"

      - name: Verify release glibc floor
        run: |
          set -euo pipefail
          expected="2.39"
          actual="$(ldd --version | sed -n '1s/.* //p')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Linux release packages must be built on the Ubuntu 24.04 GLIBC_${expected} floor, got GLIBC_${actual}."
            exit 1
          fi

      - name: Install pinned AppImage tooling
        run: |
          APPIMAGETOOL_VERSION=1.9.1
          APPIMAGE_RUNTIME_VERSION=20251108
          curl --fail --location --retry 5 --retry-delay 5 \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool
          curl --fail --location --retry 5 --retry-delay 5 \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64" \
            -o /tmp/appimage-runtime
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum --check
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum --check
          chmod +x /tmp/appimagetool

      - name: Test AppImage SVG loader packaging
        run: ./scripts/tests/test-package-svg-loader.sh

      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPIMAGETOOL_RUNTIME_FILE: /tmp/appimage-runtime
          LIMUX_MAX_GLIBC: "2.39"
          LIMUX_REQUIRE_SVG_LOADER: "1"
        run: ./scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Upload packages to release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v7
        with:
          name: limux-linux-packages-${{ steps.version.outputs.version }}
          path: dist/*
          retention-days: 30
