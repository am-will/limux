name: Build RPM Package

on:
  pull_request:
    paths:
      - .github/workflows/release-rpm.yml
      - Cargo.lock
      - Cargo.toml
      - ghostty
      - rust/**
      - scripts/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v prefix)"
        required: true

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/validate-release-version.sh "$VERSION"

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install uv for packaged runtime smoke
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.15"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            binutils \
            build-essential \
            cpio \
            dbus-x11 \
            desktop-file-utils \
            gettext \
            libadwaita-1-dev \
            libepoxy-dev \
            libgdk-pixbuf2.0-bin \
            libgl1-mesa-dri \
            libgtk-4-dev \
            librsvg2-common \
            libxml2-utils \
            libwebkitgtk-6.0-dev \
            meson \
            ninja-build \
            pkg-config \
            python3-gi \
            rpm \
            weston

      - name: Install current blueprint-compiler
        run: |
          BLUEPRINT_VERSION=v0.20.4
          git clone --depth 1 --branch "${BLUEPRINT_VERSION}" https://github.com/GNOME/blueprint-compiler.git /tmp/blueprint-compiler
          meson setup /tmp/blueprint-compiler/_build /tmp/blueprint-compiler --prefix /tmp/blueprint-prefix
          meson install -C /tmp/blueprint-compiler/_build
          echo "/tmp/blueprint-prefix/bin" >> "$GITHUB_PATH"

      - name: Test AppImage SVG loader packaging
        run: ./scripts/tests/test-package-svg-loader.sh

      - name: Build RPM package
        env:
          LIMUX_MAX_GLIBC: "2.39"
          LIMUX_REQUIRE_SVG_LOADER: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.sh "$VERSION"

      - name: Smoke exact RPM artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/smoke-release-artifacts.sh "$VERSION" rpm

      - name: Resolve RPM path
        id: rpm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          RPM_ARCH="x86_64"
          [ "$ARCH" = "aarch64" ] && RPM_ARCH="aarch64"
          RPM_OUTPUT="dist/limux-${VERSION}-1.${RPM_ARCH}.rpm"
          test -f "$RPM_OUTPUT"
          echo "rpm_path=$RPM_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "rpm_arch=$RPM_ARCH" >> "$GITHUB_OUTPUT"

      - name: Upload RPM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: limux-rpm-${{ steps.version.outputs.version }}
          path: ${{ steps.rpm.outputs.rpm_path }}
          retention-days: 30

  publish:
    name: Upload RPM to release
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download RPM package
        uses: actions/download-artifact@v8
        with:
          name: limux-rpm-${{ needs.rpm.outputs.version }}
          path: dist

      - name: Upload RPM to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.rpm.outputs.version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
