[package]
name = "limux-host-linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "limux"
path = "src/main.rs"

[features]
default = ["webkit"]
webkit = ["dep:webkit6"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
gdk4-wayland = "0.11"
libadwaita = "0.9"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
webkit6 = { version = "0.6", optional = true }
limux-control = { path = "../limux-control" }
limux-protocol = { path = "../limux-protocol" }
limux-ghostty-sys = { path = "../limux-ghostty-sys" }
serde = { version = "1", features = ["derive"] }
# Session conflict detection requires persisted f64 values to round-trip exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
dirs = "6"
shell-quote = { version = "0.7.2", default-features = false, features = ["bash"] }
tempfile.workspace = true

[build-dependencies]
cc = "1"
