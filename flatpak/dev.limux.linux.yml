# Local source-build manifest. See README.md for the remaining Flathub work.
app-id: dev.limux.linux
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.golang
command: limux

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Host terminals need the shared host /dev/pts namespace, including ttyname
  # and job control. DRI alone leaves PTYs private to the sandbox.
  - --device=all
  - --share=network
  # Project files and a host-visible control socket.
  - --filesystem=host
  - --filesystem=xdg-run/limux:create
  - --talk-name=org.freedesktop.Notifications
  # host-spawn uses HostCommand to run interactive shells on the host.
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /app/lib/sdk/zig:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/golang/bin
  env:
    CARGO_BUILD_JOBS: '2'
    CARGO_HOME: /run/build/limux/cargo
    ZIG_GLOBAL_CACHE_DIR: /run/build/limux/zig-cache
cleanup:
  - /lib/sdk

modules:
  # The rolling ziglang SDK extension is not pinned to Ghostty's Zig version.
  - name: zig
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/sdk/zig
      - cp -a . /app/lib/sdk/zig/
    sources:
      - type: archive
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        only-arches: [x86_64]
      - type: archive
        url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
        sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
        only-arches: [aarch64]

  - name: host-spawn
    buildsystem: simple
    build-options:
      env:
        GOCACHE: /run/build/host-spawn/go-cache
    build-commands:
      - go build -mod=vendor -ldflags='-s -w -X main.Version=1.6.2' -o host-spawn .
      - install -Dm755 host-spawn /app/bin/host-spawn
      - install -Dm644 LICENSE /app/share/licenses/host-spawn/LICENSE
    sources:
      - type: archive
        url: https://github.com/1player/host-spawn/archive/refs/tags/v1.6.2.tar.gz
        sha256: 77be74180d3c14cdf6199e2f5d77ad5a732b5902beecfdb81a3760038862af43
      - type: archive
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-vendor.tar.zst
        sha256: 9abfddf5c1eba0704d643de06988ff3b8cdd2f594bfb4d1c0027315552dad5cc
        strip-components: 0

  - name: limux
    buildsystem: simple
    build-options:
      # Ghostty's Zig packages still need network access. This local-build
      # manifest is not ready for a network-free Flathub builder yet.
      build-args: [--share=network]
      env:
        RUSTFLAGS: -C link-arg=-Wl,-rpath,/app/lib/limux -C link-arg=-Wl,--export-dynamic
    build-commands:
      - cd ghostty && zig build -j2 -Dapp-runtime=none -Doptimize=ReleaseFast -Dcpu=baseline -Demit-docs=false -fno-sys=gtk4-layer-shell
      - cargo build --release --locked --offline
      - install -Dm755 target/release/limux-cli /app/bin/limux
      - install -Dm755 target/release/limux /app/libexec/limux/limux-host
      - install -Dm755 flatpak/limux-host-cli /app/libexec/limux/limux-host-cli
      - install -Dm644 ghostty/zig-out/lib/libghostty-internal.so /app/lib/limux/libghostty-internal.so
      - install -dm755 /app/share/limux/ghostty
      - cp -a ghostty/zig-out/share/ghostty/. /app/share/limux/ghostty/
      - install -Dm644 ghostty/zig-out/share/terminfo/x/xterm-ghostty /app/share/limux/terminfo/x/xterm-ghostty
      - install -Dm644 rust/limux-host-linux/dev.limux.linux.desktop /app/share/applications/dev.limux.linux.desktop
      - desktop-file-edit --set-icon=dev.limux.linux /app/share/applications/dev.limux.linux.desktop
      - install -Dm644 rust/limux-host-linux/dev.limux.linux.metainfo.xml /app/share/metainfo/dev.limux.linux.metainfo.xml
      - |
        for size in 16 32 128 256 512; do
          install -Dm644 "rust/limux-host-linux/icons/app/$size.png" \
            "/app/share/icons/hicolor/${size}x${size}/apps/dev.limux.linux.png"
        done
      - install -dm755 /app/share/icons/hicolor/scalable/actions
      - install -m644 rust/limux-host-linux/icons/*.svg -t /app/share/icons/hicolor/scalable/actions/
      - install -Dm644 LICENSE /app/share/licenses/limux/LICENSE
    sources:
      # Build the checkout containing this manifest, including reviewed changes.
      - type: dir
        path: ..
        skip: [.git, .flatpak-builder, target, ghostty, build-dir]
      - type: git
        url: https://github.com/bvolpato/ghostty.git
        commit: 9fb2c115c6029064ab6ff862a023d3a9a4944d8d
        dest: ghostty
      - cargo-sources.json
